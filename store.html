  <title>Open Store</title>
  <meta name="color-scheme" content="light dark" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://caliskangalip.github.io/store.html" />
  <meta property="og:title" content="Open Store" />
  <meta property="og:description" content="Discover and download applications from our store." />
  <meta property="og:image" content="https://caliskangalip.github.io/logo.png" />

  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#111a33;
      --card: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.66);
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 18px;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg1:#f6f8ff; --bg2:#eef2ff;
        --card: rgba(0,0,0,.04);
        --border: rgba(0,0,0,.08);
        --text: rgba(0,0,0,.88);
        --muted: rgba(0,0,0,.55);
        --shadow: 0 16px 50px rgba(0,0,0,.12);
      }
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1100px 600px at 15% 20%, rgba(99,102,241,.35), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(16,185,129,.25), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .wrap{ width:min(720px, 100%); }

    .card{
      background: var(--card);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(10px);
    }

    .top{
      padding:22px 22px 14px;
      border-bottom: 1px solid var(--border);
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 240px;
    }

    .badge{
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .badge img{
      width: 56px;
      height: 56px;
      object-fit: contain;
      display:block;
    }

    h1{
      font-size: 18px;
      margin:0;
      letter-spacing:.2px;
    }
    .muted{
      margin:6px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height:1.35;
    }

    .pill{
      font-size:12px;
      padding:8px 10px;
      border-radius: 999px;
      border:1px solid var(--border);
      color: var(--muted);
      display:flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    .dot{
      width:8px; height:8px; border-radius:99px;
      background: rgba(16,185,129,.9);
      box-shadow: 0 0 0 3px rgba(16,185,129,.18);
    }

    .content{ padding:18px 22px 22px; }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      margin-top: 12px;
    }
    @media (min-width: 560px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }

    .btn{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:flex-start;
      width:100%;
      padding:14px 14px;
      border-radius: 14px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      text-decoration:none;
      color: var(--text);
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.18); }
    .btn:active{ transform: translateY(0px) scale(.99); }

    .icon{
      width:44px; height:44px;
      border-radius: 12px;
      display:grid; place-items:center;
      background: rgba(0,0,0,.12);
      border:1px solid var(--border);
      flex: 0 0 auto;
      overflow:hidden;
    }
    @media (prefers-color-scheme: light){
      .icon{ background: rgba(255,255,255,.8); }
    }
    .icon img{
      width: 26px;
      height: 26px;
      object-fit: contain;
      display: block;
    }

    .btn .t{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width: 0;
    }
    .btn .t strong{ font-size: 14px; }
    .btn .t span{ font-size: 12px; color: var(--muted); }

    .center{
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .smalllink{
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      border-bottom: 1px dashed rgba(255,255,255,.25);
    }
    @media (prefers-color-scheme: light){
      .smalllink{ border-bottom-color: rgba(0,0,0,.18); }
    }
    .smalllink:hover{ color: var(--text); }

    .hidden{ display:none !important; }

    .spinner{
      width:16px; height:16px;
      border:2px solid rgba(255,255,255,.25);
      border-top-color: rgba(255,255,255,.85);
      border-radius:99px;
      animation: spin 1s linear infinite;
    }
    @media (prefers-color-scheme: light){
      .spinner{ border-color: rgba(0,0,0,.18); border-top-color: rgba(0,0,0,.65); }
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }
  </style>

    function pickLocale() {
      const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
      for (const l of langs) {
        const base = String(l).toLowerCase().split("-")[0];
        if (I18N[base]) return base;
      }
      return "en";
    }

    const locale = pickLocale();
    const T = I18N[locale];

    // apply static texts
    document.documentElement.lang = T.htmlLang;
    document.title = T.title;
    document.getElementById("logoAlt").alt = T.logoAlt;
    document.getElementById("titleText").textContent = T.titleText;
    document.getElementById("status").textContent = T.statusDetecting;
    document.getElementById("pillText").textContent = T.pillDetecting;
    document.getElementById("chooseText").textContent = T.chooseText;
    document.getElementById("playSub").textContent = T.playSub;
    document.getElementById("appSub").textContent = T.appSub;
    document.getElementById("homeLink").textContent = T.homeLink;
    document.getElementById("noRedirect").textContent = T.noRedirect;
    document.getElementById("hint").textContent = T.hint;

    // --- behavior ---
    const statusEl = document.getElementById("status");
    const chooserEl = document.getElementById("chooser");
    const pillText = document.getElementById("pillText");
    const livePill = document.getElementById("livePill");
    const playBtn = document.getElementById("playBtn");
    const appStoreBtn = document.getElementById("appStoreBtn");
    const noRedirect = document.getElementById("noRedirect");

    playBtn.href = PLAY_URL;
    appStoreBtn.href = APPSTORE_URL;

    const params = new URLSearchParams(location.search);
    const auto = params.get("auto");
    let allowAuto = (auto !== "0");

    noRedirect.addEventListener("click", (e) => {
      e.preventDefault();
      allowAuto = false;
      showChooser(T.msgAutoOff);
    });

    function showChooser(msg){
      statusEl.textContent = msg;
      pillText.textContent = T.pillChoice;
      chooserEl.classList.remove("hidden");

      // remove spinner once
      livePill.querySelector(".spinner")?.remove();

      // set dot to gray
      const dot = livePill.querySelector(".dot");
      dot.style.background = "rgba(148,163,184,.9)";
      dot.style.boxShadow = "0 0 0 3px rgba(148,163,184,.18)";
    }

    function redirect(url, msg) {
      statusEl.textContent = msg;
      pillText.textContent = T.pillRedirecting;
      setTimeout(() => window.location.replace(url), 250);
    }

    const ua = navigator.userAgent || "";
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAppleTouch = (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (!allowAuto) {
      showChooser(T.msgChoose);
    } else if (isAndroid) {
      redirect(PLAY_URL, T.toPlay);
    } else if (isIOS || isAppleTouch) {
      redirect(APPSTORE_URL, T.toAppStore);
    } else {
      showChooser(T.msgDesktop);
    }
  </script>
