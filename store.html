<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open Store</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#111a33;
      --card: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.66);
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 18px;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg1:#f6f8ff; --bg2:#eef2ff;
        --card: rgba(0,0,0,.04);
        --border: rgba(0,0,0,.08);
        --text: rgba(0,0,0,.88);
        --muted: rgba(0,0,0,.55);
        --shadow: 0 16px 50px rgba(0,0,0,.12);
      }
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1100px 600px at 15% 20%, rgba(99,102,241,.35), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(16,185,129,.25), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .wrap{ width:min(720px, 100%); }

    .card{
      background: var(--card);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(10px);
    }

    .top{
      padding:22px 22px 14px;
      border-bottom: 1px solid var(--border);
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 240px;
    }

    .badge{
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .badge img{
      width: 56px;
      height: 56px;
      object-fit: contain;
      display:block;
    }

    h1{
      font-size: 18px;
      margin:0;
      letter-spacing:.2px;
    }
    .muted{
      margin:6px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height:1.35;
    }

    .pill{
      font-size:12px;
      padding:8px 10px;
      border-radius: 999px;
      border:1px solid var(--border);
      color: var(--muted);
      display:flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    .dot{
      width:8px; height:8px; border-radius:99px;
      background: rgba(16,185,129,.9);
      box-shadow: 0 0 0 3px rgba(16,185,129,.18);
    }

    .content{ padding:18px 22px 22px; }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      margin-top: 12px;
    }
    @media (min-width: 560px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }

    .btn{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:flex-start;
      width:100%;
      padding:14px 14px;
      border-radius: 14px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      text-decoration:none;
      color: var(--text);
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.18); }
    .btn:active{ transform: translateY(0px) scale(.99); }

    .icon{
      width:44px; height:44px;
      border-radius: 12px;
      display:grid; place-items:center;
      background: rgba(0,0,0,.12);
      border:1px solid var(--border);
      flex: 0 0 auto;
      overflow:hidden;
    }
    @media (prefers-color-scheme: light){
      .icon{ background: rgba(255,255,255,.8); }
    }
    .icon img{
      width: 26px;
      height: 26px;
      object-fit: contain;
      display: block;
    }

    .btn .t{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width: 0;
    }
    .btn .t strong{ font-size: 14px; }
    .btn .t span{ font-size: 12px; color: var(--muted); }

    .center{
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .smalllink{
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      border-bottom: 1px dashed rgba(255,255,255,.25);
    }
    @media (prefers-color-scheme: light){
      .smalllink{ border-bottom-color: rgba(0,0,0,.18); }
    }
    .smalllink:hover{ color: var(--text); }

    .hidden{ display:none !important; }

    .spinner{
      width:16px; height:16px;
      border:2px solid rgba(255,255,255,.25);
      border-top-color: rgba(255,255,255,.85);
      border-radius:99px;
      animation: spin 1s linear infinite;
    }
    @media (prefers-color-scheme: light){
      .spinner{ border-color: rgba(0,0,0,.18); border-top-color: rgba(0,0,0,.65); }
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="brand">
          <div class="badge">
            <img src="logo.png" alt="App logo" id="logoAlt" />
          </div>

          <div>
            <h1 id="titleText">Redirecting to the store…</h1>
            <p class="muted" id="status">Detecting your device.</p>
          </div>
        </div>

        <div class="pill" id="livePill">
          <span class="dot"></span>
          <span id="pillText">Detecting</span>
          <span class="spinner" aria-hidden="true"></span>
        </div>
      </div>

      <div class="content">
        <div id="chooser" class="hidden">
          <p class="muted" id="chooseText" style="margin:0 0 10px;">Which store would you like to open?</p>

          <div class="grid">
            <a class="btn" id="playBtn" href="#" rel="noopener">
              <div class="icon" aria-hidden="true">
                <img src="play_icon.png" alt="Google Play" />
              </div>
              <div class="t">
                <strong>Google Play</strong>
                <span id="playSub">For Android devices</span>
              </div>
            </a>

            <a class="btn" id="appStoreBtn" href="#" rel="noopener">
              <div class="icon" aria-hidden="true">
                <img src="appstore_icon.png" alt="App Store" />
              </div>
              <div class="t">
                <strong>App Store</strong>
                <span id="appSub">For iPhone / iPad</span>
              </div>
            </a>
          </div>

          <div class="center">
            <a class="smalllink" href="/" id="homeLink">Back to home</a>
            <a class="smalllink" href="#" id="noRedirect">Disable auto-redirect</a>
          </div>
        </div>

        <div id="hint" class="muted" style="margin-top:0;">
          If redirection doesn’t happen, you’ll see store options below.
        </div>
      </div>
    </div>
  </div>

  <script>
    // TODO: Replace with your real App Store URL when ready
    const PLAY_URL = "https://play.google.com/store/apps/details?id=com.galip.asana";
    const APPSTORE_URL = "https://apps.apple.com/app/idYOUR_APP_ID";

    // --- i18n (EN default, TR supported) ---
    const I18N = {
      en: {
        htmlLang: "en",
        title: "Open Store",
        logoAlt: "App logo",
        titleText: "Redirecting to the store…",
        statusDetecting: "Detecting your device.",
        pillDetecting: "Detecting",
        pillRedirecting: "Redirecting",
        pillChoice: "Choice",
        chooseText: "Which store would you like to open?",
        playSub: "For Android devices",
        appSub: "For iPhone / iPad",
        homeLink: "Back to home",
        noRedirect: "Disable auto-redirect",
        hint: "If redirection doesn’t happen, you’ll see store options below.",
        msgAutoOff: "Auto-redirect disabled. Please choose a store.",
        msgChoose: "Please choose a store.",
        msgDesktop: "Desktop device detected. Please choose a store.",
        toPlay: "Redirecting to Google Play…",
        toAppStore: "Redirecting to the App Store…"
      },
      tr: {
        htmlLang: "tr",
        title: "Mağazaya Git",
        logoAlt: "Uygulama logosu",
        titleText: "Mağazaya yönlendiriyorum…",
        statusDetecting: "Cihaz türü kontrol ediliyor.",
        pillDetecting: "Algılanıyor",
        pillRedirecting: "Yönlendiriliyor",
        pillChoice: "Seçim",
        chooseText: "Hangi mağazayı açmak istersin?",
        playSub: "Android cihazlar için",
        appSub: "iPhone / iPad için",
        homeLink: "Ana sayfaya dön",
        noRedirect: "Otomatik yönlendirmeyi kapat",
        hint: "Eğer yönlendirme olmazsa, aşağıdaki seçenekler görünecek.",
        msgAutoOff: "Otomatik yönlendirme kapatıldı. Mağaza seç.",
        msgChoose: "Mağaza seç.",
        msgDesktop: "Masaüstü cihaz algılandı. Mağaza seç.",
        toPlay: "Google Play'e yönlendiriliyor…",
        toAppStore: "App Store'a yönlendiriliyor…"
      }
    };

    function pickLocale() {
      const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
      for (const l of langs) {
        const base = String(l).toLowerCase().split("-")[0];
        if (I18N[base]) return base;
      }
      return "en";
    }

    const locale = pickLocale();
    const T = I18N[locale];

    // apply static texts
    document.documentElement.lang = T.htmlLang;
    document.title = T.title;
    document.getElementById("logoAlt").alt = T.logoAlt;
    document.getElementById("titleText").textContent = T.titleText;
    document.getElementById("status").textContent = T.statusDetecting;
    document.getElementById("pillText").textContent = T.pillDetecting;
    document.getElementById("chooseText").textContent = T.chooseText;
    document.getElementById("playSub").textContent = T.playSub;
    document.getElementById("appSub").textContent = T.appSub;
    document.getElementById("homeLink").textContent = T.homeLink;
    document.getElementById("noRedirect").textContent = T.noRedirect;
    document.getElementById("hint").textContent = T.hint;

    // --- behavior ---
    const statusEl = document.getElementById("status");
    const chooserEl = document.getElementById("chooser");
    const pillText = document.getElementById("pillText");
    const livePill = document.getElementById("livePill");
    const playBtn = document.getElementById("playBtn");
    const appStoreBtn = document.getElementById("appStoreBtn");
    const noRedirect = document.getElementById("noRedirect");

    playBtn.href = PLAY_URL;
    appStoreBtn.href = APPSTORE_URL;

    const params = new URLSearchParams(location.search);
    const auto = params.get("auto");
    let allowAuto = (auto !== "0");

    noRedirect.addEventListener("click", (e) => {
      e.preventDefault();
      allowAuto = false;
      showChooser(T.msgAutoOff);
    });

    function showChooser(msg){
      statusEl.textContent = msg;
      pillText.textContent = T.pillChoice;
      chooserEl.classList.remove("hidden");

      // remove spinner once
      livePill.querySelector(".spinner")?.remove();

      // set dot to gray
      const dot = livePill.querySelector(".dot");
      dot.style.background = "rgba(148,163,184,.9)";
      dot.style.boxShadow = "0 0 0 3px rgba(148,163,184,.18)";
    }

    function redirect(url, msg) {
      statusEl.textContent = msg;
      pillText.textContent = T.pillRedirecting;
      setTimeout(() => window.location.replace(url), 250);
    }

    const ua = navigator.userAgent || "";
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAppleTouch = (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (!allowAuto) {
      showChooser(T.msgChoose);
    } else if (isAndroid) {
      redirect(PLAY_URL, T.toPlay);
    } else if (isIOS || isAppleTouch) {
      redirect(APPSTORE_URL, T.toAppStore);
    } else {
      showChooser(T.msgDesktop);
    }
  </script>
</body>
</html>
